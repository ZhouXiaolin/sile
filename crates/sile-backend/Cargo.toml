[package]
name = "sile-backend"
version.workspace = true
edition.workspace = true

[dependencies]
sile-core = { path = "../sile-core" }
sile-lsir = { path = "../sile-lsir" }
libloading.workspace = true
naga.workspace = true
wgpu.workspace = true
pollster.workspace = true
tempfile.workspace = true

# The Metal backend runs only on macOS. Codegen stays portable, but the runtime
# binds the Objective-C frameworks, which do not build elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
