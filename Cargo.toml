[workspace]
members = ["crates/sile", "crates/handwritten-bench", "crates/sile-macros", "crates/sile-core", "crates/sile-hir", "crates/sile-tile-ir", "crates/sile-lsir", "crates/sile-backend"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
flume = "0.11"
half = "2"
libloading = "0.9.0"
rand = "0.10.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }
tempfile = "3"
naga = { version = "26", features = ["wgsl-in", "wgsl-out"] }
wgpu = "26"
pollster = "0.4"
thiserror = "2"

# wgpu-hal compiles every WGSL kernel through AIR with fast-math on, and
# fast-math miscompiles the tile language's non-finite constants (see
# vendor/wgpu-hal/README.md for the fold, and sile-lsir instcombine's
# recombine_masked_adds for the IR-level defense that makes it rare).
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
