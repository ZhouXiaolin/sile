[workspace]
members = ["crates/sile", "crates/handwritten-bench", "crates/sile-macros", "crates/sile-core", "crates/sile-hir", "crates/sile-tile-ir", "crates/sile-llvm-ir", "crates/sile-backend"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
flume = "0.11"
half = "2"
libloading = "0.9.0"
rand = "0.10.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }
tempfile = "3"
naga = { version = "26", features = ["wgsl-in", "wgsl-out"] }
wgpu = "26"
pollster = "0.4"
thiserror = "2"
